name: Validate plugin package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifests, shared skills, and complete release archive
        run: python scripts/build-admin-release.py --output "$RUNNER_TEMP/docsbot-administration.zip"
